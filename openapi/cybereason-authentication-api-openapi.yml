openapi: 3.2.0
info:
  title: Cybereason Authentication API
  version: 23.x
  description: Cybereason EDR/XDR REST API.
  contact:
    name: Cybereason Nest
    url: https://nest.cybereason.com/documentation/api-documentation
  license:
    name: Proprietary
servers:
- url: https://{tenant}.cybereason.net
  description: Cybereason tenant
  variables:
    tenant:
      default: example
      description: Your Cybereason tenant hostname prefix.
security:
- SessionCookie: []
tags:
- name: Authentication
paths:
  /login.html:
    post:
      tags:
      - Authentication
      summary: Log in and obtain a JSESSIONID cookie
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - username
              - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 'Login successful (Set-Cookie: JSESSIONID)'
          headers:
            Set-Cookie:
              schema:
                type: string
        '302':
          description: Redirect on successful login
        '401':
          description: Invalid credentials
      operationId: postLoginHtml
      x-operation-id-source: derived
  /logout:
    get:
      tags:
      - Authentication
      summary: Log out the current session
      responses:
        '200':
          description: Logged out
      operationId: getLogout
      x-operation-id-source: derived
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie returned by POST /login.html.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Available on Cybereason 20.1+ for token-based access.
externalDocs:
  description: Cybereason API documentation
  url: https://nest.cybereason.com/documentation/api-documentation
