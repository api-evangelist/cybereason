openapi: 3.2.0
info:
  title: Cybereason Remediation API
  version: 23.x
  description: Cybereason EDR/XDR REST API.
  contact:
    name: Cybereason Nest
    url: https://nest.cybereason.com/documentation/api-documentation
  license:
    name: Proprietary
servers:
- url: https://{tenant}.cybereason.net
  description: Cybereason tenant
  variables:
    tenant:
      default: example
      description: Your Cybereason tenant hostname prefix.
security:
- SessionCookie: []
tags:
- name: Remediation
paths:
  /rest/remediate:
    post:
      tags:
      - Remediation
      summary: Trigger remediation actions on a Malop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationRequest'
      responses:
        '200':
          description: Remediation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationResponse'
      operationId: postRestRemediate
      x-operation-id-source: derived
  /rest/remediate/status/{malopId}:
    parameters:
    - in: path
      name: malopId
      required: true
      schema:
        type: string
    get:
      tags:
      - Remediation
      summary: Get remediation status for a Malop
      responses:
        '200':
          description: Remediation status
          content:
            application/json:
              schema:
                type: object
      operationId: getRestRemediateStatusByMalopId
      x-operation-id-source: derived
  /rest/remediate/abort:
    post:
      tags:
      - Remediation
      summary: Abort remediation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Aborted
      operationId: postRestRemediateAbort
      x-operation-id-source: derived
components:
  schemas:
    RemediationResponse:
      type: object
      properties:
        remediationId:
          type: string
        initiatingUser:
          type: string
        start:
          type: integer
          format: int64
        statusLog:
          type: array
          items:
            type: object
    RemediationRequest:
      type: object
      properties:
        initiatorUserName:
          type: string
        malopId:
          type: string
        actionsByMachine:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                targetId:
                  type: string
                actionType:
                  type: string
                  enum:
                  - KILL_PROCESS
                  - QUARANTINE_FILE
                  - DELETE_REGISTRY_KEY
                  - UNQUARANTINE_FILE
                  - BLOCK_FILE
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie returned by POST /login.html.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Available on Cybereason 20.1+ for token-based access.
externalDocs:
  description: Cybereason API documentation
  url: https://nest.cybereason.com/documentation/api-documentation
