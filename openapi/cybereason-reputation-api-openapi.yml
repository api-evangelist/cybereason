openapi: 3.2.0
info:
  title: Cybereason Reputation API
  version: 23.x
  description: Cybereason EDR/XDR REST API.
  contact:
    name: Cybereason Nest
    url: https://nest.cybereason.com/documentation/api-documentation
  license:
    name: Proprietary
servers:
- url: https://{tenant}.cybereason.net
  description: Cybereason tenant
  variables:
    tenant:
      default: example
      description: Your Cybereason tenant hostname prefix.
security:
- SessionCookie: []
tags:
- name: Reputation
paths:
  /rest/classification:
    get:
      tags:
      - Reputation
      summary: List reputation entries
      responses:
        '200':
          description: Reputations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reputation'
      operationId: getRestClassification
      x-operation-id-source: derived
    post:
      tags:
      - Reputation
      summary: Add or update reputation entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Reputation'
      responses:
        '200':
          description: Reputations updated
      operationId: postRestClassification
      x-operation-id-source: derived
components:
  schemas:
    Reputation:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        maliciousType:
          type: string
          enum:
          - blacklist
          - whitelist
          - remove
        prevent:
          type: boolean
        remove:
          type: boolean
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie returned by POST /login.html.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Available on Cybereason 20.1+ for token-based access.
externalDocs:
  description: Cybereason API documentation
  url: https://nest.cybereason.com/documentation/api-documentation
