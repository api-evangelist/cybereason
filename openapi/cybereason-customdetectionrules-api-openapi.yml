openapi: 3.2.0
info:
  title: Cybereason Custom Detection Rules API
  version: 23.x
  description: Cybereason EDR/XDR REST API.
  contact:
    name: Cybereason Nest
    url: https://nest.cybereason.com/documentation/api-documentation
  license:
    name: Proprietary
servers:
- url: https://{tenant}.cybereason.net
  description: Cybereason tenant
  variables:
    tenant:
      default: example
      description: Your Cybereason tenant hostname prefix.
security:
- SessionCookie: []
tags:
- name: CustomDetectionRules
paths:
  /rest/customRules/decisionFeature/live:
    get:
      tags:
      - CustomDetectionRules
      summary: List active custom detection rules
      responses:
        '200':
          description: Active rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDetectionRule'
      operationId: getRestCustomRulesDecisionFeatureLive
      x-operation-id-source: derived
  /rest/customRules/decisionFeature/create:
    post:
      tags:
      - CustomDetectionRules
      summary: Create a custom detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDetectionRule'
      responses:
        '200':
          description: Rule created
      operationId: postRestCustomRulesDecisionFeatureCreate
      x-operation-id-source: derived
  /rest/customRules/decisionFeature/update:
    post:
      tags:
      - CustomDetectionRules
      summary: Update a custom detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDetectionRule'
      responses:
        '200':
          description: Rule updated
      operationId: postRestCustomRulesDecisionFeatureUpdate
      x-operation-id-source: derived
components:
  schemas:
    CustomDetectionRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rootCause:
          type: string
        malopDetectionType:
          type: string
        severity:
          type: string
        enabled:
          type: boolean
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie returned by POST /login.html.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Available on Cybereason 20.1+ for token-based access.
externalDocs:
  description: Cybereason API documentation
  url: https://nest.cybereason.com/documentation/api-documentation
