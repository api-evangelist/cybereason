openapi: 3.2.0
info:
  title: Cybereason Malops API
  version: 23.x
  description: Cybereason EDR/XDR REST API.
  contact:
    name: Cybereason Nest
    url: https://nest.cybereason.com/documentation/api-documentation
  license:
    name: Proprietary
servers:
- url: https://{tenant}.cybereason.net
  description: Cybereason tenant
  variables:
    tenant:
      default: example
      description: Your Cybereason tenant hostname prefix.
security:
- SessionCookie: []
tags:
- name: Malops
paths:
  /rest/detection/inbox:
    post:
      tags:
      - Malops
      summary: Query the Malop inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MalopInboxRequest'
      responses:
        '200':
          description: Malop inbox results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MalopInboxResponse'
      operationId: postRestDetectionInbox
      x-operation-id-source: derived
  /rest/crimes/unified:
    post:
      tags:
      - Malops
      summary: Query unified Malops
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Malop list
          content:
            application/json:
              schema:
                type: object
      operationId: postRestCrimesUnified
      x-operation-id-source: derived
components:
  schemas:
    MalopInboxResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            malops:
              type: array
              items:
                type: object
                properties:
                  guid:
                    type: string
                  displayName:
                    type: string
                  severity:
                    type: string
                  status:
                    type: string
                  creationTime:
                    type: integer
                    format: int64
                  lastUpdateTime:
                    type: integer
                    format: int64
    MalopInboxRequest:
      type: object
      properties:
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        statusFilter:
          type: array
          items:
            type: string
            enum:
            - Active
            - ToReview
            - Closed
            - Reopened
            - FalsePositive
            - UnderInvestigation
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session cookie returned by POST /login.html.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Available on Cybereason 20.1+ for token-based access.
externalDocs:
  description: Cybereason API documentation
  url: https://nest.cybereason.com/documentation/api-documentation
