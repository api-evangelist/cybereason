  - url: https://nest.cybereason.com/
    type: Portal
    title: Cybereason Nest Customer Portal (gated)
  description: >-
    The Cybereason REST API is a gated, region-scoped API hosted at api.<region>.cybereason.net that allows
    customers and integration partners to query MalOps, retrieve sensor inventory and status, run threat-hunting
    investigations across endpoint telemetry, manage isolation and remediation actions, and stream detections
    into SIEM, SOAR, and ticketing systems. Documentation and credentials are issued through the Cybereason
    Nest customer portal and are not generally available to the public.
